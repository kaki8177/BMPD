<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ESAZ 법인 Vision BMPD 분석 (ESAZ Vision Downtime Analysis)</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family: 'Malgun Gothic', sans-serif;
		}

		body {
			background-color: #f5f5f5;
			display: flex;
			justify-content: center;
			padding: 20px 10px;
		}

		.container {
			width: 100%;
			max-width: 450px;
			background: white;
			border: 1px solid #e0e0e0;
			border-radius: 4px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
		}

		.header {
			background-color: #444;
			color: white;
			text-align: center;
			padding: 25px 15px;
		}

		.header h1 {
			font-size: 20px;
			font-weight: bold;
			margin-bottom: 10px;
			line-height: 1.4;
		}

		.header p {
			font-size: 13px;
			color: #ccc;
		}

		.tabs {
			background: #333;
			color: white;
			text-align: center;
			padding: 12px 0;
			font-size: 14px;
			font-weight: bold;
		}

		.form-body {
			padding: 20px;
		}

		.form-group {
			margin-bottom: 18px;
		}

		.form-group label {
			display: block;
			font-size: 14px;
			font-weight: bold;
			margin-bottom: 6px;
			color: #111;
		}

		.time-input-group {
			display: flex;
			gap: 5px;
		}

		.btn-time {
			padding: 0 10px;
			background: #6c757d;
			color: white;
			border: none;
			border-radius: 4px;
			font-size: 12px;
			cursor: pointer;
			white-space: nowrap;
		}

		.btn-time:hover {
			background: #5a6268;
		}

		select,
		input[type="text"],
		textarea {
			width: 100%;
			padding: 10px;
			font-size: 14px;
			border: 1px solid #ddd;
			border-radius: 4px;
			background-color: #fafafa;
			outline: none;
			color: #333;
		}

		select:focus,
		input[type="text"]:focus,
		textarea:focus {
			background-color: #fff;
			border-color: #888;
		}

		textarea {
			resize: vertical;
			min-height: 80px;
		}

		.btn-submit {
			width: 100%;
			background-color: #007bff;
			color: white;
			border: none;
			padding: 14px;
			font-size: 15px;
			font-weight: bold;
			border-radius: 4px;
			cursor: pointer;
		}

		.btn-submit:disabled {
			background-color: #ccc;
			cursor: not-allowed;
		}

		.footer-mark {
			text-align: right;
			color: #aaa;
			font-size: 12px;
			margin-top: 15px;
		}
	</style>

</head>

<body>

	<div class="container">
		<div class="header">
			<h1>ESAZ 법인 Vision<br>BMPD 분석<br><span style="font-size:14px; font-weight:normal; color:#ddd;">(ESAZ Vision Downtime Analysis)</span></h1>
			<p>지속 가능한 데이터 분석 시스템 (Sustainable Data Analysis System)</p>
		</div>

		<div class="tabs">부동 분석 리포트 생성 (Generate Downtime Analysis Report)</div>

		<div class="form-body">
			<div class="form-group">
				<label>종류 (Type) : *</label>
				<select id="type">
                <option value="-">-</option>
                <option value="BM">BM</option>
                <option value="PD">PD</option>
                <option value="PM">PM</option>
                <option value="ETC">ETC</option>
            </select>
			</div>

			<div class="form-group">
				<label>0. Site : *</label>
				<select id="site">
                <option value="-">-</option>
                <option value="ESAZ">ESAZ</option>
            </select>
			</div>

			<div class="form-group">
				<label>1-1. 공정 (Process) : *</label>
				<select id="process" onchange="filterDropdowns()">
                <option value="-">-</option>
                <option value="CCW">CCW</option>
                <option value="CIT">CIT</option>
                <option value="FTW">FTW</option>
                <option value="LFW">LFW</option>
                <option value="ISI">ISI</option>
                <option value="JRI">JRI</option>
                <option value="SMW">SMW</option>
                <option value="CRW">CRW</option>
                <option value="ELF">ELF</option>
                <option value="LHS">LHS</option>
                <option value="EOL">EOL</option>
            </select>
			</div>

			<div class="form-group">
				<label>1-2. 호기 (Unit No.) : *</label>
				<select id="hogi">
                <option value="-">-</option>
            </select>
			</div>

			<div class="form-group">
				<label>2-2. 검사기 (Vision Type) : *</label>
				<select id="visionType">
                <option value="-">-</option>
                </select>
			</div>

			<div class="form-group">
				<label>2-3. 원인처 (Source of Cause) : *</label>
				<select id="source">
                <option value="-">-</option>
                <option value="Camera">Camera</option>
                <option value="Lighting">Lighting</option>
                <option value="PC">PC</option>
                <option value="전장 (Electricity)">전장 (Electricity)</option>
                <option value="S/W">S/W</option>
                <option value="H/W">H/W</option>
                <option value="ROI 수정 (ROI Modification)">ROI 수정 (ROI Modification)</option>
                <option value="Recipe 수정 (Recipe Modification)">Recipe 수정 (Recipe Modification)</option>
                <option value="Calibration">Calibration</option>
                <option value="공정불량 (Process Defect)">공정불량 (Process Defect)</option>
                <option value="설비기인 (Machine Issue)">설비기인 (Machine Issue)</option>
            </select>
			</div>

			<div class="form-group">
				<label>3-1. 발생시간 (Occurrence Time) :</label>
				<div class="time-input-group">
					<input type="text" id="startTime">
					<button type="button" class="btn-time" onclick="setTimeField('startTime')">현재시간</button>
				</div>
			</div>

			<div class="form-group">
				<label>3-2. 조치완료 (Action Completed Time) :</label>
				<div class="time-input-group">
					<input type="text" id="endTime">
					<button type="button" class="btn-time" onclick="setTimeField('endTime')">현재시간</button>
				</div>
			</div>

			<div class="form-group">
				<label>4. 작업자 (PIC) : *</label>
				<input type="text" id="worker" placeholder="이름 입력 (Enter Name)">
			</div>

			<div class="form-group">
				<label>5. 현상 (Phenomenon) : *</label>
				<textarea id="phenomenon" placeholder="현상 입력 (Enter Phenomenon)"></textarea>
			</div>

			<div class="form-group">
				<label>6. 원인 (Cause) : *</label>
				<textarea id="cause" placeholder="원인 입력 (Enter Cause)"></textarea>
			</div>

			<div class="form-group">
				<label>7. 조치 (Action) : *</label>
				<textarea id="action" placeholder="조치 내용 입력 (Enter Action)"></textarea>
			</div>

			<button class="btn-submit" id="submitBtn" onclick="saveAndCopy()">저장 및 리포트 복사 (Save & Copy Report)</button>
			<div class="footer-mark">Original by JBYang · ESAZ 수정</div>
		</div>
	</div>

	<script>
	  // ⚠️ 중요: 발급받으신 구글 웹앱 URL(macros/s/.../exec) 주소를 여기에 정확히 붙여넣으세요!
		const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyRax0-Y5Glfad_YA7qOE22D-yWQJWr0Sqv-bO8S6uW_RNVlgeOeG8U80tn-0X6Ii0UeA/exec";

    // 1. 마스터 호기 데이터
    const HOGI_MASTER = {
        "CCW": [
                "1호기",
                "2호기"
        ],
        "CIT": [
                "1호기",
                "2호기"
        ],
        "FTW": [
                "1호기",
                "2호기"
        ],
        "LFW": [
                "1호기",
                "2호기"
        ],
        "ISI": [
                "1호기",
                "2호기"
        ],
        "JRI": [
                "1호기",
                "2호기"
        ],
        "SMW": [
                "1호기",
                "2호기"
        ],
        "CRW": [
                "1호기",
                "2호기"
        ],
        "ELF": [
                "1호기",
                "2호기"
        ],
        "LHS": [
                "1호기",
                "2호기"
        ],
        "EOL": [
                "1호기",
                "2호기"
        ]
};

    // 2. [업데이트] 마스터 비전 종류 데이터 (공정별 완벽 매핑 및 접두사 부여)
    const VISION_MASTER = {
        "CCW": [
                "[센서] #1 양극 집전판 오투입 검사",
                "[2D] #2 양극 집전판 원자재 검사",
                "[2D] #3 J/R 양극 상태 검사",
                "[2D] #4 CCW 용접 전 검사",
                "[2D] #5 CCW 용접 후 검사"
        ],
        "CIT": [
                "[2D] #6 Taping 검사",
                "[2D] #7 J/R 음극 상태 검사"
        ],
        "FTW": [
                "[2D] #29 FTW 용접 후 검사"
        ],
        "LFW": [
                "[2D] #8 음극 Lid 원자재 검사",
                "[센서] #9 음극 Lid 용접 전 검사(동심도)",
                "[2D] #10 LFW 음극 용접 후 검사"
        ],
        "ISI": [
                "[2D] #11 Insulator 원자재 검사",
                "[센서] #12 Insulator 삽입성 검사",
                "[2D] #13 Can 원자재 외부 리벳 검사",
                "[2D] #14 Can 원자재 내부 리벳 검사",
                "[2D] #15 Can 원자재 개구부 검사",
                "[2D] #16 Can 내벽 검사",
                "[센서] #17 Can 원자재 총고 검사",
                "[3D] #101 Can 내부 Rivet 평탄도 검사(3D)"
        ],
        "JRI": [
                "[센서] #18 Insulator 유무 검사",
                "[2D] #30 Side 검사",
                "[3D] #102 Lid 삽입성 검사(3D)"
        ],
        "SMW": [
                "[2D] #19 SMW 용접 전 검사",
                "[2D] #20 SMW 용접 후 검사"
        ],
        "CRW": [
                "[2D] #21 Reform 전 J/R Core 분리막 검사",
                "[2D] #22 Reform 후 J/R Core 분리막 검사",
                "[3D] #103 Knurl 상태 및 이물 검사-1(3D)",
                "[3D] #104 Knurl 상태 및 이물 검사-2(3D)",
                "[2D] #23 CRW 용접 후 검사"
        ],
        "ELF": [
                "[2D] #24 주액 후 J/R Core 분리막 검사"
        ],
        "LHS": [
                "[2D] #25 Plug 원자재 검사",
                "[2D] #27 LHS 용접 전 검사",
                "[2D] #28 LHS 용접 후 검사",
                "[3D] #105 Cell 총고 검사(3D)"
        ],
        "EOL": [
                "[3D] Side 측면 외경 검사-1(3D)",
                "[3D] Side 측면 외경 검사-2(3D)",
                "[3D] Side 측면 외경 검사-3(3D)",
                "[3D] Side 측면 외경 검사-4(3D)",
                "[3D] 평탄도·총고 검사(3D)"
        ]
};

    window.onload = function() {
        // 초기 데이터 필터링 실행 및 시간 설정
        filterDropdowns();
        initTime();
    };

    // 공정별 호기 및 비전 종류 정형화 필터링 기능
    function filterDropdowns() {
        const process = document.getElementById('process').value;
        const hogiSelect = document.getElementById('hogi');
        const visionSelect = document.getElementById('visionType');
        
        // 1. 호기(Unit No.) 동적 매핑
        hogiSelect.innerHTML = '<option value="-">-</option>';
        if (process !== "-" && HOGI_MASTER[process]) {
            HOGI_MASTER[process].forEach(name => {
                const opt = document.createElement('option');
                opt.value = name; opt.innerText = name;
                hogiSelect.appendChild(opt);
            });
        } else if (process === "-") {
            Object.keys(HOGI_MASTER).forEach(key => {
                HOGI_MASTER[key].forEach(name => {
                    if (!Array.from(hogiSelect.options).some(o => o.value === name)) {
                        const opt = document.createElement('option');
                        opt.value = name; opt.innerText = name;
                        hogiSelect.appendChild(opt);
                    }
                });
            });
        }

        // 2. 검사기(Vision Type) — 2D / 3D / 센서로 묶어서 표시
        visionSelect.innerHTML = '<option value="-">-</option>';
        let list = [];
        if (process !== "-" && VISION_MASTER[process]) list = VISION_MASTER[process];
        else if (process === "-") Object.keys(VISION_MASTER).forEach(k => list = list.concat(VISION_MASTER[k]));
        ["2D", "3D", "센서"].forEach(t => {
            const items = list.filter(n => n.startsWith("[" + t + "]"));
            if (!items.length) return;
            const g = document.createElement('optgroup');
            g.label = t;
            items.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name; opt.innerText = name;
                g.appendChild(opt);
            });
            visionSelect.appendChild(g);
        });
    }

    function getFormattedTime() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const date = String(now.getDate()).padStart(2, '0');
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        
        hours = hours % 12;
        hours = hours ? hours : 12;
        const hoursStr = String(hours).padStart(2, '0');
        
        return `${year}.${month}.${date}. ${ampm} ${hoursStr}:${minutes}`;
    }

    function setTimeField(fieldId) {
        document.getElementById(fieldId).value = getFormattedTime();
    }

    function initTime() {
        const timeStr = getFormattedTime();
        document.getElementById('startTime').value = timeStr;
        document.getElementById('endTime').value = timeStr;
    }

    function saveAndCopy() {
        const fieldsToValidate = [
            { id: 'type', name: '종류 (Type)' },
            { id: 'site', name: 'Site' },
            { id: 'process', name: '공정 (Process)' },
            { id: 'hogi', name: '호기 (Unit No.)' },
            { id: 'visionType', name: '2-2. Vision Type' },
            { id: 'source', name: '원인처 (Source of Cause)' }
        ];

        for (let field of fieldsToValidate) {
            if (document.getElementById(field.id).value === '-') {
                alert(`[경고] ${field.name} 항목을 선택해주세요.`);
                document.getElementById(field.id).focus();
                return;
            }
        }

        const textFields = [
            { id: 'worker', name: '작업자 (PIC)' },
            { id: 'phenomenon', name: '현상 (Phenomenon)' },
            { id: 'cause', name: '원인 (Cause)' },
            { id: 'action', name: '조치 (Action)' }
        ];

        for (let field of textFields) {
            if (!document.getElementById(field.id).value.trim()) {
                alert(`[경고] ${field.name} 내용을 입력해주세요.`);
                document.getElementById(field.id).focus();
                return;
            }
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "처리 중... (Processing...)";

        const data = {
            type: document.getElementById('type').value,
            site: document.getElementById('site').value,
            process: document.getElementById('process').value,
            hogi: document.getElementById('hogi').value,
            visionType: document.getElementById('visionType').value,
            source: document.getElementById('source').value,
            startTime: document.getElementById('startTime').value,
            endTime: document.getElementById('endTime').value,
            worker: document.getElementById('worker').value.trim(),
            phenomenon: document.getElementById('phenomenon').value.trim(),
            cause: document.getElementById('cause').value.trim(),
            action: document.getElementById('action').value.trim()
        };

        const report = `[부동 분석 공유 (Downtime Analysis Report)]
종류 (Type): ${data.type}
0. Site : ${data.site}
1-1. 공정 (Process) : ${data.process}
1-2. 호기 (Unit No.) : ${data.hogi}
2-2. Vision Type : ${data.visionType}
2-3. 원인처 (Source of Cause) : ${data.source}
3-1. 발생시간 (Occurrence Time) : ${data.startTime}
3-2. 조치완료 (Action Completed) : ${data.endTime}
4. 작업자 (PIC) : ${data.worker}
5. 현상 (Phenomenon) : ${data.phenomenon}
6. 원인 (Cause) : ${data.cause}
7. 조치 (Action) : ${data.action}`;

        fetch(SCRIPT_URL, { 
            method: "POST", 
            mode: "no-cors", 
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(data) 
        })
        .then(() => {
            copyText(report, btn);
        })
        .catch(err => {
            console.error(err);
            copyText(report, btn);
        });
    }

    function copyText(text, btnElement) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                alert("구글 시트에 데이터가 전송되었고, 리포트가 복사되었습니다!\n\n(Data sent and report copied!)");
                resetBtn(btnElement);
            }).catch(() => {
                fallbackCopy(text, btnElement);
            });
        } else {
            fallbackCopy(text, btnElement);
        }
    }

    function fallbackCopy(text, btnElement) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed"; 
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand("copy");
            alert("저장 및 복사가 완료되었습니다!\n(Save and copy completed!)");
        } catch (err) {
            alert("복사 실패 (Copy failed)");
        }
        document.body.removeChild(textarea);
        resetBtn(btnElement);
    }

    function resetBtn(btnElement) {
        btnElement.disabled = false;
        btnElement.innerText = "저장 및 리포트 복사 (Save & Copy Report)";
    }

	</script>


</body>

</html>
